<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventilation</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Chart.js CDN (ขนาดเบา ~60KB) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* ------------------------------------------
       1. ตัวแปรชุดสี (Theme Variables)
       ------------------------------------------ */
    :root {
      /* Dark Mode (ค่าเริ่มต้น) */
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --shadow: rgba(0, 0, 0, 0.35);
      --btn-bg: #334155;
      --btn-text: #ffffff;
      --grid-color: #334155;
    }

    [data-theme="light"] {
      /* Light Mode */
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --shadow: rgba(0, 0, 0, 0.08);
      --btn-bg: #e2e8f0;
      --btn-text: #0f172a;
      --grid-color: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background: var(--bg-body);
      color: var(--text-main);
      padding: 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 34px;
      font-weight: 700;
    }

    /* ปุ่มสลับธีม Dark / Light */
    .theme-toggle {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px var(--shadow);
    }

    .theme-toggle:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }

    .online {
      background: #22c55e;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 18px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 35px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 20px var(--shadow);
    }

    .card:hover {
      transform: translateY(-6px);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .title {
      font-size: 20px;
      color: var(--text-sub);
      margin-bottom: 10px;
    }

    .value {
      font-size: 60px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .status {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 18px;
    }

    .normal {
      background: #22c55e;
      color: #ffffff;
    }

    .warning {
      background: #facc15;
      color: #111827;
    }

    .danger {
      background: #ef4444;
      color: #ffffff;
    }

    /* ------------------------------------------
       2. ส่วนกล่องกราฟ Analytics Section
       ------------------------------------------ */
    .charts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 25px;
      margin-bottom: 35px;
    }

    .chart-card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 20px var(--shadow);
    }

    .chart-card h3 {
      font-size: 20px;
      color: var(--text-main);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chart-wrapper {
      position: relative;
      height: 250px;
      width: 100%;
    }

    .footer {
      margin-top: 15px;
      background: var(--bg-card);
      padding: 20px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      font-size: 18px;
      box-shadow: 0 4px 15px var(--shadow);
    }

    /* ------------------------------------------
       3. Responsive CSS สำหรับโทรศัพท์มือถือ
       ------------------------------------------ */
    @media(max-width:700px) {
      body {
        padding: 15px;
      }

      .header {
        flex-direction: column;
        align-items: stretch;
        gap: 15px;
      }

      .header-left {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .header h1 {
        font-size: 24px;
      }

      .theme-toggle {
        width: 100%;
        justify-content: center;
        padding: 12px;
        font-size: 16px;
      }

      .online {
        text-align: center;
        width: 100%;
      }

      .value {
        font-size: 42px;
      }

      .charts-container {
        grid-template-columns: 1fr;
      }

      .chart-wrapper {
        height: 200px;
      }

      .footer {
        justify-content: center;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-left">
      <h1>Battery Thermal Ventilation Unit</h1>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
        🌙 Dark Mode
      </button>
    </div>
    <div class="online" id="onlineStatus">
      🟢 ONLINE
    </div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="icon">🌡️</div>
      <div class="title">Temperature</div>
      <div class="value" id="temp">0.0°C</div>
      <div class="status normal" id="tempStatus">NORMAL</div>
    </div>

    <div class="card">
      <div class="icon">⚡</div>
      <div class="title">Output Voltage</div>
      <div class="value" id="volt">0.00V</div>
    </div>

    <div class="card">
      <div class="icon">💨</div>
      <div class="title">Smoke Sensor</div>
      <div class="value" id="smoke">0</div>
      <div class="status normal" id="smokeStatus">SAFE</div>
    </div>
  </div>

  <div class="charts-container">
    <div class="chart-card">
      <h3>🌡️ Temperature History (°C)</h3>
      <div class="chart-wrapper">
        <canvas id="tempChart"></canvas>
      </div>
    </div>

    <div class="chart-card">
      <h3>💨 Smoke Level History</h3>
      <div class="chart-wrapper">
        <canvas id="smokeChart"></canvas>
      </div>
    </div>
  </div>

  <div class="footer">
    <div>
      📅 Date : <span id="currentDate">--/--/----</span>
    </div>
    <div>
      🕒 Time : <span id="currentTime">--:--:--</span>
    </div>
  </div>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzKVkXE_hKbJkregcHvukbXkNzRS7nvKft_INM1tcvzW7TsfoOhA5gxRRjp2FuEdVp1/exec";

    // ==========================================
    // ตัวแปรและตั้งค่า Chart.js Real-time
    // ==========================================
    const maxDataPoints = 10;     // แสดงสูงสุด 10 จุด
    let chartTimerCounter = 0;   // ตัวนับวินาทีสำหรับอัปเดตกราฟ

    const getTextColor = () => document.documentElement.getAttribute("data-theme") === "light" ? "#0f172a" : "#ffffff";
    const getGridColor = () => document.documentElement.getAttribute("data-theme") === "light" ? "#e2e8f0" : "#334155";

    // กราฟ Temperature
    const ctxTemp = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(ctxTemp, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Temperature (°C)',
          data: [],
          borderColor: '#22c55e',
          backgroundColor: 'rgba(34, 197, 94, 0.15)',
          fill: true,
          tension: 0.3,
          borderWidth: 3,
          pointRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: getTextColor }, grid: { color: getGridColor } },
          y: { ticks: { color: getTextColor }, grid: { color: getGridColor }, beginAtZero: false }
        }
      }
    });

    // กราฟ Smoke
    const ctxSmoke = document.getElementById('smokeChart').getContext('2d');
    const smokeChart = new Chart(ctxSmoke, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Smoke Value',
          data: [],
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.15)',
          fill: true,
          tension: 0.3,
          borderWidth: 3,
          pointRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: getTextColor }, grid: { color: getGridColor } },
          y: { ticks: { color: getTextColor }, grid: { color: getGridColor }, beginAtZero: true }
        }
      }
    });

    // ฟังก์ชันอัปเดตกราฟ (สะสมครบ 10 จุดแล้วเคลียร์เริ่มนับใหม่)
    function addChartData(chart, label, value, alertType) {
      if (chart.data.labels.length >= maxDataPoints) {
        chart.data.labels = [];
        chart.data.datasets[0].data = [];
      }

      chart.data.labels.push(label);
      chart.data.datasets[0].data.push(value);

      if (alertType === "danger") {
        chart.data.datasets[0].borderColor = '#ef4444';
        chart.data.datasets[0].backgroundColor = 'rgba(239, 68, 68, 0.2)';
      } else if (alertType === "warning") {
        chart.data.datasets[0].borderColor = '#facc15';
        chart.data.datasets[0].backgroundColor = 'rgba(250, 204, 21, 0.2)';
      } else {
        chart.data.datasets[0].borderColor = (chart === tempChart) ? '#22c55e' : '#3b82f6';
        chart.data.datasets[0].backgroundColor = (chart === tempChart) ? 'rgba(34, 197, 94, 0.15)' : 'rgba(59, 130, 246, 0.15)';
      }

      chart.update();
    }

    // ==========================================
    // ระบบ Toggle Dark / Light Mode
    // ==========================================
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const btn = document.getElementById("themeToggle");

      if (currentTheme === "light") {
        document.documentElement.setAttribute("data-theme", "dark");
        btn.innerHTML = "🌙 Dark Mode";
        localStorage.setItem("theme", "dark");
      } else {
        document.documentElement.setAttribute("data-theme", "light");
        btn.innerHTML = "☀️ Light Mode";
        localStorage.setItem("theme", "light");
      }

      [tempChart, smokeChart].forEach(chart => {
        chart.options.scales.x.ticks.color = getTextColor();
        chart.options.scales.x.grid.color = getGridColor();
        chart.options.scales.y.ticks.color = getTextColor();
        chart.options.scales.y.grid.color = getGridColor();
        chart.update();
      });
    }

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "light") {
      document.documentElement.setAttribute("data-theme", "light");
      document.getElementById("themeToggle").innerHTML = "☀️ Light Mode";
    }

    // ==========================================
    // นาฬิกาและวันที่ปัจจุบัน ( Real-time )
    // ==========================================
    function updateClock() {
      const now = new Date();
      const dateString = now.toLocaleDateString('th-TH', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
      const timeString = now.toLocaleTimeString('th-TH', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });

      document.getElementById("currentDate").innerText = dateString;
      document.getElementById("currentTime").innerText = timeString;
    }

    updateClock();
    setInterval(updateClock, 1000);

    // ==========================================
    // ดึงข้อมูลหลัก (ทำงานทุกๆ 1 วินาที)
    // ==========================================
    async function updateDashboard() {
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();

        let online = document.getElementById("onlineStatus");
        let tempStatus = document.getElementById("tempStatus");
        let smokeStatus = document.getElementById("smokeStatus");
        const timeNow = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        if (data.status === "offline") {
          online.innerHTML = "🔴 OFFLINE";
          online.style.background = "#ef4444";

          document.getElementById("temp").innerHTML = "0.0°C";
          document.getElementById("volt").innerHTML = "0.00V";
          document.getElementById("smoke").innerHTML = "0";

          tempStatus.className = "status normal";
          tempStatus.innerHTML = "NORMAL";

          smokeStatus.className = "status normal";
          smokeStatus.innerHTML = "SAFE";
        } 
        else {
          online.innerHTML = "🟢 ONLINE";
          online.style.background = "#22c55e";

          let temp = parseFloat(data.temp);
          let volt = parseFloat(data.volt);
          let smoke = parseInt(data.smoke);

          // อัปเดตตัวเลขบน Card ทันทีทุกๆ 1 วินาที
          document.getElementById("temp").innerHTML = temp.toFixed(1) + "°C";
          document.getElementById("volt").innerHTML = volt.toFixed(2) + "V";
          document.getElementById("smoke").innerHTML = smoke;

          // คำนวณสถานะ Temp
          let tempAlertType = "normal";
          tempStatus.className = "status";
          if (temp >= 50) {
            tempStatus.innerHTML = "DANGER";
            tempStatus.classList.add("danger");
            tempAlertType = "danger";
          } else if (temp >= 40) {
            tempStatus.innerHTML = "WARNING";
            tempStatus.classList.add("warning");
            tempAlertType = "warning";
          } else {
            tempStatus.innerHTML = "NORMAL";
            tempStatus.classList.add("normal");
          }

          // คำนวณสถานะ Smoke
          let smokeAlertType = "normal";
          smokeStatus.className = "status";
          if (smoke <= 200) {
            smokeStatus.innerHTML = "SAFE";
            smokeStatus.classList.add("normal");
          } else if (smoke <= 500) {
            smokeStatus.innerHTML = "WARNING";
            smokeStatus.classList.add("warning");
            smokeAlertType = "warning";
          } else {
            smokeStatus.innerHTML = "DANGER";
            smokeStatus.classList.add("danger");
            smokeAlertType = "danger";
          }

          // ----------------------------------------------------
          // ระบบนับเวลาอัปเดตกราฟ (จุดแรกลงทันที, จุดถัดไปทุกๆ 30 วินาที)
          // ----------------------------------------------------
          if (tempChart.data.labels.length === 0) {
            // ถ้ากราฟว่างเปล่า ให้บันทึกจุดแรกทันทีแล้วรีเซ็ตตัวนับ
            addChartData(tempChart, timeNow, temp, tempAlertType);
            addChartData(smokeChart, timeNow, smoke, smokeAlertType);
            chartTimerCounter = 0;
          } else {
            // วินาทีต่อๆ มาให้นับเพิ่มทีละ 1
            chartTimerCounter++;
            if (chartTimerCounter >= 30) {
              addChartData(tempChart, timeNow, temp, tempAlertType);
              addChartData(smokeChart, timeNow, smoke, smokeAlertType);
              chartTimerCounter = 0; // ครบ 30 วินาทีค่อยลงจุดถัดไปและรีเซ็ตตัวนับ
            }
          }
        }

      } catch (err) {
        console.log("Fetch Error:", err);
      }
    }

    updateDashboard();
    setInterval(updateDashboard, 1000);

    // ==========================================
    // Card Flash Animation
    // ==========================================
    function flash(id) {
      const obj = document.getElementById(id);
      if (obj) {
        obj.style.transform = "scale(1.08)";
        obj.style.transition = "0.25s";
        setTimeout(() => {
          obj.style.transform = "scale(1)";
        }, 250);
      }
    }

    setInterval(() => {
      flash("temp");
      flash("volt");
      flash("smoke");
    }, 3000);
  </script>

</body>

</html>
